mode: ContinuousDeployment
# The CluedIn version is now encoded in the published package suffix (e.g. .470/.480/.500), so this
# repo's own version no longer needs to track CluedIn. Reset to 1.0; commits-before skips past the
# highest pre-existing tag (4.6.3, 2026-09-04T21:17:27+08:00).
next-version: 1.0
ignore:
  commits-before: 2026-09-07T00:00:00
branches:
  master:
    mode: ContinuousDelivery
  pull-request:
    tag: pr
    increment: None
  develop:
    tag: alpha1